# Uso sugerido:
# docker compose --env-file .env_produccion -f docker-compose_produccion.yaml up -d

services:
  search-service:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8001"
    env_file:
      - path: .env_produccion
        required: false
    environment:
      - NEO4J_HOST=search-neo4j
      - NEO4J_PORT=7687
      - MONGO_DB_HOST=search-mongo
      - MONGO_DB_PORT=27017
    depends_on:
      search-neo4j:
        condition: service_healthy
      search-mongo:
        condition: service_healthy
    volumes:
      - search_logs:/app/centinela_logs
      - ./resources:/app/resources
    networks:
      centinela-net:
        aliases:
          - search-service

  search-neo4j:
    image: neo4j:5.18
    restart: unless-stopped
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_ADMIN_USERNAME:-neo4j}/${NEO4J_ADMIN_PASSWORD:-change-me-strong-neo4j-admin-password}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7687"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      centinela-net:
        aliases:
          - search-neo4j

  search-mongo:
    image: mongo:7.0
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-mongo_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change-me-strong-mongo-root-password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      centinela-net:
        aliases:
          - search-mongo

volumes:
  search_logs:
    name: centinela_search_logs
  neo4j_data:
    name: centinela_neo4j_data
    external: true
  neo4j_logs:
    name: centinela_neo4j_logs
    external: true
  neo4j_import:
    name: centinela_neo4j_import
    external: true
  neo4j_plugins:
    name: centinela_neo4j_plugins
    external: true
  mongo_data:
    name: centinela_mongo_data
    external: true

networks:
  centinela-net:
    external: true
