name: CD — Producción

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword
  NEO4J_HOST: localhost
  NEO4J_PORT: '7687'
  MONGO_DB_NAME: centinela_test
  MONGO_DB_USERNAME: admin
  DJANGO_SETTINGS_MODULE: config.settings
  MONGO_DB_PASSWORD: adminpass
  MONGO_DB_HOST: localhost
  MONGO_DB_PORT: '27017'
  DEBUG: 'True'

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas de lint
        run: python -m pip install ruff==0.16.10 black==26.10.0
      - name: ruff check
        run: python -m ruff check .
      - name: black --check
        run: python -m black --check .

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    needs: lint
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
        - 7474:7474
        - 7687:7687
        options: --health-cmd "wget -q --spider http://localhost:7474 || exit 1" --health-interval 15s --health-timeout 10s --health-retries 8
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpass
        ports:
        - 27017:27017
        options: --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -q -r requirements.txt pytest pytest-cov pytest-django
      - name: Ejecutar tests unitarios
        env:
          COVERAGE_FILE: coverage-unitarios-prod.dat
        run: |
          sleep 35  # Neo4j tarda en aceptar conexiones aunque el healthcheck pase
          pytest apps/ -v --tb=short -m "not integration" \
            --junitxml=report-unitarios-prod.xml \
            --cov=apps --cov-report=term --cov-fail-under=0
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-unitarios-prod
          if-no-files-found: ignore
          path: |
            report-unitarios-prod.xml
            coverage-unitarios-prod.dat

  integration-tests:
    name: Tests de integración
    runs-on: ubuntu-latest
    needs: lint
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
        - 7474:7474
        - 7687:7687
        options: --health-cmd "wget -q --spider http://localhost:7474 || exit 1" --health-interval 15s --health-timeout 10s --health-retries 8
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpass
        ports:
        - 27017:27017
        options: --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -q -r requirements.txt pytest pytest-cov pytest-django
      - name: Ejecutar tests de integración
        env:
          COVERAGE_FILE: coverage-integracion-prod.dat
        run: |
          sleep 35  # Neo4j tarda en aceptar conexiones aunque el healthcheck pase
          set +e
          pytest apps/ -v --tb=short -m "integration" \
            --junitxml=report-integracion-prod.xml \
            --cov=apps --cov-report=term --cov-fail-under=0
          code=$?
          set -e
          # pytest devuelve 5 cuando no hay tests con la marca: no es un fallo.
          if [ "$code" -eq 5 ]; then echo "Sin tests de integración en este servicio."; exit 0; fi
          exit "$code"
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-integracion-prod
          if-no-files-found: ignore
          path: |
            report-integracion-prod.xml
            coverage-integracion-prod.dat

  coverage:
    name: Cobertura (mínimo 90 %)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar coverage
        run: python -m pip install "coverage[toml]"
      - name: Descargar resultados de tests
        uses: actions/download-artifact@v8
        with:
          pattern: resultados-*
          path: resultados
          merge-multiple: true
      - name: Verificar cobertura mínima
        run: |
          python -m coverage combine resultados/coverage-*.dat
          python -m coverage xml -o coverage.xml
          python -m coverage report --fail-under=90
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-prod
          if-no-files-found: ignore
          path: coverage.xml

  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Validar docker-compose
        run: |
          [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
          docker network create centinela-net >/dev/null 2>&1 || true
          docker compose config --quiet
      - name: Build imagen
        run: docker build -t search-service:${{ github.sha }} .
      - name: Verificar imagen
        run: docker image inspect search-service:${{ github.sha }} --format '{{.Id}} {{.Size}}'

  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: [coverage, build]
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/search-service
          git fetch origin main
          git reset --hard origin/main
          git lfs pull

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps search-service

      - name: Health check
        run: |
          sleep 30
          HEALTHY=false
          # Gunicorn only opens the port after importing torch, spaCy and KeyBERT
          # (~1 min on this server), so wait up to ~5 minutes instead of ~1.
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8001/health/ || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback al commit anterior"
            cd /opt/centinela/search-service && git reset --hard HEAD~1
            git lfs pull
            cd /opt/centinela && docker compose up -d --build --no-deps search-service
            exit 1
          fi
          echo "Deploy exitoso — search_engine_backend en producción"
