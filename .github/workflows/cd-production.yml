name: "CD — search_engine_backend → Producción"

on:
  push:
    branches: [main]

env:
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword
  NEO4J_HOST: localhost
  NEO4J_PORT: "7687"
  MONGO_DB_NAME: centinela_test
  MONGO_DB_USERNAME: admin
  DJANGO_SETTINGS_MODULE: config.settings
  MONGO_DB_PASSWORD: adminpass
  MONGO_DB_HOST: localhost
  MONGO_DB_PORT: "27017"
  DEBUG: "True"

jobs:
  # ── Unitarios ────────────────────────────────────────────────────────────
  test-unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-django pytest-cov
      - name: Esperar arranque de Neo4j
        run: sleep 30
      - name: Ejecutar tests unitarios
        run: |
          pytest apps/search_engine/tests/ -v --tb=short \
            --junitxml=report-unit-prod.xml \
            --cov=apps --cov-report=term --cov-report=xml:coverage-unit-prod.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results-prod
          path: |
            report-unit-prod.xml
            coverage-unit-prod.xml

  # ── Integración ────────────────────────────────────────────────────────────
  test-integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpass
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-django pytest-cov
      - name: Esperar arranque de Neo4j y MongoDB
        run: sleep 35
      - name: Ejecutar tests de integración
        run: |
          pytest apps/ -v --tb=short -m integration \
            --junitxml=report-integration-prod.xml \
            --cov=apps --cov-report=term --cov-report=xml:coverage-integration-prod.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results-prod
          path: |
            report-integration-prod.xml
            coverage-integration-prod.xml

  # ── Deploy producción ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: test-integration
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/search_engine_backend
          git fetch origin main
          git reset --hard origin/main
          git lfs pull

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build --no-deps search-service

      - name: Health check con rollback automático
        run: |
          sleep 30
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8001/api-se/v1/health/ || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "404" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback al commit anterior"
            cd /opt/centinela/search_engine_backend && git reset --hard HEAD~1
            git lfs pull
            cd /opt/centinela && docker compose up -d --build --no-deps search-service
            exit 1
          fi
          echo "Deploy exitoso — search_engine_backend en producción"
